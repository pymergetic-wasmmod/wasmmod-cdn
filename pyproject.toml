[project]
name = "pymergetic-wasmmod-cdn"
dynamic = ["version"]
description = "Async FastAPI CDN for wasmmod packs (pymergetic.wasmmod.cdn)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rouven Raudzus", email = "raudzus@pymergetic.com" }]
dependencies = [
    "pymergetic-wasmmod-cdn-client>=0.1.0a3",
    "cryptography>=42",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "email-validator>=2.2.0",
    "bcrypt>=4.2.0",
    "itsdangerous>=2.2.0",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
s3 = [
    "aioboto3>=13.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "aioboto3>=13.0.0",
]

[project.scripts]
wasmmod-cdn = "pymergetic.wasmmod.cdn.cli:main"
pymergetic-wasmmod-cdn = "pymergetic.wasmmod.cdn.cli:main"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymergetic*"]
exclude = [
    "pymergetic.wasmmod.cdn_client",
    "pymergetic.wasmmod.cdn_client.*",
    # Dev symlink → ../wasmmod-tools/src/pymergetic/wasmmod/tools (IDE);
    # never ship in this wheel (real dependency comes from PyPI instead).
    "pymergetic.wasmmod.tools",
    "pymergetic.wasmmod.tools.*",
]
namespaces = true

[tool.setuptools.package-data]
"pymergetic.wasmmod.cdn" = [
    "web/templates/**/*.html",
    "web/static/**/*",
    "web/autoexec.tpl.py",
]

[tool.setuptools_scm]
version_file = "pymergetic/wasmmod/cdn/_version.py"
fallback_version = "0.1.0a5"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["client/README.md", "*.md", "**/*.tpl.py", "pymergetic/wasmmod/tools"]

[tool.ruff.lint]
# FastAPI Depends/File/Form defaults; telemetry/verify best-effort catches.
ignore = ["B008", "BLE001", "S110", "TRY004", "RUF015"]

[tool.basedpyright]
include = ["pymergetic", "tests"]
exclude = ["**/*.tpl.py", "**/.venv", "**/__pycache__"]
extraPaths = [".", "../wasmmod-tools/src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingModuleSource = "none"

[tool.pyright]
include = ["pymergetic", "tests"]
exclude = ["**/*.tpl.py", "**/.venv", "**/__pycache__"]
extraPaths = [".", "../wasmmod-tools/src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
reportMissingModuleSource = "none"
