[project]
name = "metal-cdn"
version = "0.1.0a1"
description = "CDN / channel publish tooling for wasmmod packs (Metal / MicroPython)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rouven Raudzus", email = "raudzus@pymergetic.com" }]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
metal-cdn = "metal_cdn.publish:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["metal_cdn*"]
