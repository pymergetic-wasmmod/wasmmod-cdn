# Publish pymergetic-wasmmod-cdn.
# Prefer Trusted Publishing (OIDC). Until project publishers match this filename,
# set repo secret PYPI_API_TOKEN (user/org scope covering both packages) — same as a6.
name: publish-pypi-server

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only (skip PyPI upload)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # No `environment:` — pending Trusted Publisher registered with empty / any
    # Environment name (same as wasmmod / wasmmod-tools / wasmmod-test).
    permissions:
      id-token: write
      contents: read
    env:
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build server
        run: |
          python -m pip install -U pip build twine
          python -m build --wheel --sdist --outdir dist-server .
          twine check dist-server/*

      - name: Publish server to PyPI (OIDC)
        if: >-
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
          && env.HAS_PYPI_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-server/
          attestations: false

      - name: Publish server to PyPI (API token escape hatch)
        if: >-
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
          && env.HAS_PYPI_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-server/
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
