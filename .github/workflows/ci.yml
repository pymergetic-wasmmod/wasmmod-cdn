name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ./client -e ".[dev]" --config-settings editable_mode=compat

      - name: Ruff
        run: ruff check pymergetic tests

      - name: Pytest
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build client + server sdists/wheels
        run: |
          python -m pip install -U pip build twine
          # Build wheel and sdist from the git checkout (not wheel-from-sdist):
          # client/setuptools-scm root=.. fails under /tmp extraction.
          python -m build --wheel --sdist --outdir dist-client client
          python -m build --wheel --sdist --outdir dist-server .
          twine check dist-client/* dist-server/*
