# HTTP :8080 — ACME + redirect (host forwards public :80 → here)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Let's Encrypt HTTP-01 (always at domain root, never under base_path)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else → HTTPS (public :443 forwarded to :8443)
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS :8443 — TLS terminate, proxy to metal-cdn on :8000
# After first certbot run, point ssl_certificate* at live paths under /etc/letsencrypt.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    # Self-signed placeholder so nginx starts before LE; replace after certbot.
    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 128m;

    # Optional: serve ACME over HTTPS too (some clients retry https)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # App at configurable base_path (default /cdn — change location + METAL_CDN_BASE_PATH together)
    location /cdn/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /cdn;
        # Keep /cdn prefix — app is mounted with METAL_CDN_BASE_PATH=/cdn
        # host.docker.internal = app on the host when nginx runs in compose
        proxy_pass http://host.docker.internal:8000;
    }

    location = /cdn {
        return 308 /cdn/;
    }

    # Site root free for other apps / landing later — blank page, not a 404.
    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title></title></head><body></body></html>';
    }
}
